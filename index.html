<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Portal to Blues: The Crossroads</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- Three.js and GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 3D Canvas — the plaza AND every dimension's pillar chamber render here -->
<div id="canvas-container"></div>

<!-- Controls hint (plaza only) -->
<div id="controls-hint">Move your mouse to look around &nbsp;&middot;&nbsp; Click a glowing portal to enter</div>

<!-- Shown briefly if a player tries to step into a portal after all
     six keys are collected but before the chest has been opened. -->
<div id="locked-hint">The chest is waiting for you — open it before you can step through a portal again.</div>

<!-- Intro helper text (plaza only) -->
<div id="intro-text">
  <p class="intro-eyebrow">The Crossroads</p>
  <p class="serif italic intro-line">Click any glowing portal to begin.</p>
</div>

<!-- Slim bar shown only while inside a dimension's chamber -->
<div id="chamber-bar">
  <button id="back-btn" class="back-btn">
    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
    Return to Plaza
  </button>
  <div class="chamber-title">
    <span id="era-years"></span>
    <h1 id="era-name" class="serif italic"></h1>
  </div>
  <span class="chamber-hint">Click a pillar to explore it</span>
</div>

<!-- Speech bubble shown when a kid clicks a background character (a
     villager, dancer, listener, etc.) in the plaza or a chamber. Follows
     that character's on-screen position and stays up until the player
     presses Back (which returns the camera to where they were). -->
<div id="character-bubble"><div id="character-bubble-text"></div></div>
<button id="character-back-btn" class="back-btn">
  <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
  Back
</button>

<!-- The one content panel a clicked pillar reveals -->
<div id="content-panel">
  <div class="panel-head">
    <button id="panel-close">
      <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
      Return to Chamber
    </button>
    <h2 id="panel-type-label" class="serif italic"></h2>
  </div>
  <div id="panel-body"></div>
</div>


<!-- Final challenge: appears once the chest has been opened and the
     reality-break destruction sequence finishes. Stays up (re-asking
     from the six era questions) until answered correctly. -->
<div id="finale-quiz-overlay">
  <div class="finale-quiz-inner reality-break">
    <p class="finale-quiz-eyebrow">Reality itself is breaking. Answer to seal the rift.</p>
    <p id="finale-quiz-question" class="serif italic finale-quiz-question"></p>
    <div id="finale-quiz-options"></div>
    <p id="finale-quiz-failure"></p>
    <p id="finale-quiz-feedback">&nbsp;</p>
  </div>
</div>

<!-- Flash transition overlay -->
<div id="flash-overlay"></div>

<!-- Cinematic vignette, purely decorative -->
<div id="vignette"></div>

<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/maps.js"></script>
<script src="js/worlds.js"></script>
<script src="js/scene.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>

</body>
</html>
