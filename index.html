<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Portal to Blues: The Crossroads</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- Tailwind CSS (utility classes used inside the dimension panels) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Three.js and GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 3D Canvas Container -->
<div id="canvas-container"></div>

<!-- Floating Labels Layer -->
<div id="labels-layer"></div>

<!-- Controls hint -->
<div id="controls-hint">Move your mouse to look around &middot; click a portal to step in</div>

<!-- Intro Helper Text -->
<div id="intro-text" class="flex flex-col items-center gap-2">
  <p class="text-sm tracking-[0.2em] uppercase text-gray-400">The Crossroads</p>
  <p class="serif italic text-2xl text-white">Click any glowing portal to begin.</p>
</div>

<!-- Dimension UI (Hidden initially) -->
<div id="dimension-ui">
  <div class="content-container flex-grow relative">

    <!-- Top Navigation -->
    <div class="flex items-center justify-between mb-12">
      <button id="back-btn" class="back-btn px-5 py-2 rounded-full text-sm flex items-center gap-2 text-gray-300">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Return to Plaza
      </button>
      <span id="ui-era-tag" class="text-xs uppercase tracking-widest text-gray-500 font-semibold"></span>
    </div>

    <!-- Header Section -->
    <div class="text-center mb-16">
      <p id="ui-years" class="text-sm tracking-widest uppercase font-semibold mb-3 transition-colors duration-500"></p>
      <h1 id="ui-title" class="serif italic text-5xl md:text-7xl font-bold mb-6 text-white drop-shadow-lg"></h1>
      <p id="ui-blurb" class="text-lg md:text-xl text-gray-300 max-w-2xl mx-auto font-light leading-relaxed"></p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-12 gap-12">

      <!-- History + Facts + Quiz -->
      <div class="md:col-span-7 space-y-10">
        <div>
          <h2 class="text-xs uppercase tracking-widest text-gray-400 border-b border-gray-800 pb-2 mb-6">The Story</h2>
          <div id="ui-history" class="prose prose-invert prose-lg text-gray-300 font-light leading-relaxed"></div>
        </div>

        <div>
          <h2 class="text-xs uppercase tracking-widest text-gray-400 border-b border-gray-800 pb-2 mb-6">Did You Know?</h2>
          <ul id="ui-facts" class="space-y-3"></ul>
        </div>

        <div id="ui-quiz"></div>
      </div>

      <!-- Sidebar: Vocab & Songs -->
      <div class="md:col-span-5 space-y-10">

        <!-- Vocab Cards -->
        <div>
          <h3 class="text-xs uppercase tracking-widest text-gray-400 border-b border-gray-800 pb-2 mb-4">Key Vocabulary</h3>
          <div id="ui-vocab-list"></div>
        </div>

        <!-- Songs Section -->
        <div>
          <h3 class="text-xs uppercase tracking-widest text-gray-400 border-b border-gray-800 pb-2 mb-4">Essential Listening</h3>
          <div id="ui-songs" class="flex flex-col"></div>
          <p class="text-xs text-gray-500 mt-4 italic">Tracks open in a new tab for listening, with an adult's OK.</p>
        </div>

      </div>
    </div>

  </div>
</div>

<!-- Flash Transition Overlay -->
<div id="flash-overlay"></div>

<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/scene.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>

</body>
</html>
